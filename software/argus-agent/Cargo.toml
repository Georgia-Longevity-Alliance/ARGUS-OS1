[package]
name = "argus-pre"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "argus-pre"
path = "src/main.rs"

[[bin]]
name = "argus-agent"
path = "src/bin/argus_agent.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tungstenite = "0.24"
base64 = "0.22"
